<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Audiobook Player</title>
  <meta name="theme-color" content="#121212">
  
  <!-- (Optional) Keep this line if you still want to use your manifest.json for the home screen icon -->
  <link rel="manifest" href="manifest.json">

  <!-- ========================================== -->
  <!-- CSS STYLES                                 -->
  <!-- ========================================== -->
  <style>
    :root {
      --bg: #121212;
      --surface: #1e1e1e;
      --primary: #bb86fc;
      --text: #ffffff;
      --text-muted: #a0a0a0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); -webkit-tap-highlight-color: transparent; }

    #app { max-width: 500px; margin: 0 auto; height: 100vh; overflow: hidden; position: relative; background: var(--bg); }

    .view { display: none; height: 100%; flex-direction: column; }
    .view.active { display: flex; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: var(--surface); }
    header h1 { font-size: 1.25rem; }

    button { background: none; border: none; color: var(--primary); cursor: pointer; font-size: 1rem; }
    .icon-btn { font-size: 1.5rem; }
    .primary-btn { background: var(--primary); color: #000; padding: 10px 20px; border-radius: 8px; font-weight: bold; }

    /* Library */
    #book-list { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .book-card { background: var(--surface); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .book-card h3 { font-size: 1.1rem; }
    .book-card p { color: var(--text-muted); font-size: 0.9rem; }
    .progress-bar-bg { background: #333; height: 6px; border-radius: 3px; width: 100%; overflow: hidden; }
    .progress-bar-fill { background: var(--primary); height: 100%; width: 0%; }
    .book-actions { display: flex; justify-content: space-between; margin-top: 8px; }
    .btn-delete { color: #ff5252; }

    /* Player */
    .player-content { flex: 1; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .cover-wrapper { width: 200px; height: 200px; background: #333; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin-bottom: 32px; font-size: 4rem; }
    #player-title { font-size: 1.5rem; margin-bottom: 8px; }
    #player-author { color: var(--text-muted); font-weight: normal; margin-bottom: 32px; }

    .progress-container { width: 100%; display: flex; align-items: center; gap: 12px; margin-bottom: 32px; font-size: 0.85rem; color: var(--text-muted); }
    input[type=range] { flex: 1; accent-color: var(--primary); }

    .controls { display: flex; align-items: center; gap: 32px; }
    .control-btn { border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .control-btn.primary { background: var(--primary); color: #000; width: 64px; height: 64px; font-size: 2rem; }
    .control-btn.secondary { width: 48px; height: 48px; background: var(--surface); font-size: 1.2rem; }

    /* Modal */
    .modal { position: absolute; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
    .modal.hidden { display: none; }
    .modal-content { background: var(--surface); padding: 24px; border-radius: 12px; width: 100%; display: flex; flex-direction: column; gap: 16px; }
    .modal-content input { width: 100%; padding: 12px; background: #333; border: 1px solid #444; border-radius: 8px; color: white; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 16px; margin-top: 8px; }
  </style>
</head>
<body>

  <!-- ========================================== -->
  <!-- HTML STRUCTURE                             -->
  <!-- ========================================== -->
  <div id="app">
    
    <!-- Library View -->
    <main id="library-view" class="view active">
      <header>
        <h1>My Audiobooks</h1>
        <button id="btn-show-add" class="icon-btn">➕</button>
      </header>
      <div id="book-list" class="grid">
        <!-- Books injected via JS -->
      </div>
    </main>

    <!-- Player View -->
    <main id="player-view" class="view">
      <header>
        <button id="btn-back" class="icon-btn">⬇ Library</button>
        <button id="btn-speed" class="text-btn">1x</button>
      </header>
      
      <div class="player-content">
        <div class="cover-wrapper">
          <div id="player-cover" class="default-cover">🎧</div>
        </div>
        <h2 id="player-title">Book Title</h2>
        <h3 id="player-author">Author Name</h3>

        <div class="progress-container">
          <span id="time-current">00:00:00</span>
          <input type="range" id="seek-bar" value="0" min="0" max="100" step="0.1">
          <span id="time-total">00:00:00</span>
        </div>

        <div class="controls">
          <button id="btn-skip-back" class="control-btn secondary">⏪ 15s</button>
          <button id="btn-play-pause" class="control-btn primary">▶</button>
          <button id="btn-skip-fwd" class="control-btn secondary">30s ⏩</button>
        </div>
      </div>
    </main>

    <!-- Add Book Modal -->
    <div id="add-modal" class="modal hidden">
      <div class="modal-content">
        <h2>Add Audiobook</h2>
        <input type="text" id="input-url" placeholder="Dropbox URL (Required)">
        <input type="text" id="input-title" placeholder="Title (Required)">
        <input type="text" id="input-author" placeholder="Author (Optional)">
        <div class="modal-actions">
          <button id="btn-cancel-add" class="text-btn">Cancel</button>
          <button id="btn-save-add" class="primary-btn">Save</button>
        </div>
      </div>
    </div>

  </div>

  <!-- ========================================== -->
  <!-- JAVASCRIPT LOGIC                           -->
  <!-- ========================================== -->
  <script>
    /* --- DATABASE (IndexedDB) --- */
    const DB_NAME = 'AudiobookDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'books';

    const DB = {
      db: null,
      async init() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME, DB_VERSION);
          request.onerror = (e) => reject(e);
          request.onsuccess = (e) => { this.db = e.target.result; resolve(); };
          request.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              db.createObjectStore(STORE_NAME, { keyPath: 'id' });
            }
          };
        });
      },
      async getAll() {
        return new Promise((resolve) => {
          const tx = this.db.transaction(STORE_NAME, 'readonly');
          const store = tx.objectStore(STORE_NAME);
          const req = store.getAll();
          req.onsuccess = () => resolve(req.result || []);
        });
      },
      async save(book) {
        return new Promise((resolve) => {
          const tx = this.db.transaction(STORE_NAME, 'readwrite');
          const store = tx.objectStore(STORE_NAME);
          store.put(book);
          tx.oncomplete = () => resolve();
        });
      },
      async delete(id) {
        return new Promise((resolve) => {
          const tx = this.db.transaction(STORE_NAME, 'readwrite');
          const store = tx.objectStore(STORE_NAME);
          store.delete(id);
          tx.oncomplete = () => resolve();
        });
      }
    };

    /* --- APP LOGIC --- */
    let audio = new Audio();
    let currentBook = null;
    let saveDebounceTimer = null;
    let networkSeverTimer = null;

    // DOM Elements
    const views = { library: document.getElementById('library-view'), player: document.getElementById('player-view') };
    const listEl = document.getElementById('book-list');
    const modal = document.getElementById('add-modal');
    const btnPlayPause = document.getElementById('btn-play-pause');
    const seekBar = document.getElementById('seek-bar');
    const timeCurrent = document.getElementById('time-current');
    const timeTotal = document.getElementById('time-total');
    const speedBtn = document.getElementById('btn-speed');

    // Available Playback Speeds
    const speeds = [0.75, 1, 1.1, 1.25, 1.5, 1.75, 2];

    async function initApp() {
      await DB.init();
      renderLibrary();
      setupListeners();
    }

    // Convert Dropbox link to a direct streaming link
    function normalizeDropboxUrl(url) {
      try {
        const u = new URL(url);
        u.searchParams.set('raw', '1'); // Force raw file
        u.searchParams.delete('dl');
        return u.toString();
      } catch(e) {
        return url;
      }
    }

    function formatTime(sec) {
      if (!sec || isNaN(sec)) return "00:00:00";
      const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = Math.floor(sec % 60);
      return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    async function renderLibrary() {
      const books = await DB.getAll();
      books.sort((a, b) => b.lastPlayedAt - a.lastPlayedAt);
      
      listEl.innerHTML = books.map(book => {
        const pct = book.duration ? Math.min(100, (book.position / book.duration) * 100) : 0;
        return `
          <div class="book-card">
            <h3>${book.title}</h3>
            <p>${book.author || 'Unknown Author'}</p>
            <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${pct}%"></div></div>
            <p>${formatTime(book.position)} / ${formatTime(book.duration)} (${Math.round(pct)}%)</p>
            <div class="book-actions">
              <button class="btn-delete" onclick="deleteBook('${book.id}')">Delete</button>
              <button class="primary-btn" onclick="openPlayer('${book.id}')">Continue</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function deleteBook(id) {
      if (confirm("Remove this book from library? (Dropbox file is untouched)")) {
        if (currentBook && currentBook.id === id) stopPlayer();
        await DB.delete(id);
        renderLibrary();
      }
    }

    async function openPlayer(id) {
      const books = await DB.getAll();
      currentBook = books.find(b => b.id === id);
      if (!currentBook) return;
      
      // Update UI
      document.getElementById('player-title').innerText = currentBook.title;
      document.getElementById('player-author').innerText = currentBook.author || '';
      audio.playbackRate = currentBook.playbackRate || 1;
      speedBtn.innerText = audio.playbackRate + 'x';
      
      // Initialize stream
      attachAudioStream(currentBook.dropboxUrl, currentBook.position);
      
      // Switch views
      views.library.classList.remove('active');
      views.player.classList.add('active');
      views.player.style.display = 'flex';
      views.library.style.display = 'none';
    }

    function attachAudioStream(url, position) {
      audio.src = url;
      audio.preload = 'metadata'; // Prevent aggressive initial download
      audio.currentTime = position || 0;
      audio.load();
    }

    function stopPlayer() {
      audio.pause();
      audio.removeAttribute('src'); // Fully destroys connection
      audio.load();
      currentBook = null;
    }

    function togglePlay() {
      if (!currentBook) return;
      
      // Strict Buffering Control logic:
      // If we destroyed the src to save data while paused, we must re-attach it.
      if (!audio.src || audio.src === window.location.href) {
        attachAudioStream(currentBook.dropboxUrl, currentBook.position);
      }

      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    }

    function seekUpdate() {
      if (!currentBook) return;
      audio.currentTime = (seekBar.value / 100) * audio.duration;
      saveProgress();
    }

    // Throttle database writes so it doesn't fire every millisecond
    function saveProgress() {
      if (!currentBook || isNaN(audio.currentTime)) return;
      currentBook.position = audio.currentTime;
      currentBook.duration = audio.duration || currentBook.duration;
      currentBook.lastPlayedAt = Date.now();
      
      clearTimeout(saveDebounceTimer);
      saveDebounceTimer = setTimeout(() => {
        DB.save(currentBook);
      }, 3000); // Save every 3 seconds of active state
    }

    // Setup all interactions
    function setupListeners() {
      // Add Book Flow
      document.getElementById('btn-show-add').onclick = () => modal.classList.remove('hidden');
      document.getElementById('btn-cancel-add').onclick = () => modal.classList.add('hidden');
      
      document.getElementById('btn-save-add').onclick = async () => {
        const url = document.getElementById('input-url').value.trim();
        const title = document.getElementById('input-title').value.trim();
        const author = document.getElementById('input-author').value.trim();
        if (!url || !title) return alert('URL and Title are required.');
        
        const newBook = {
          id: 'book_' + Date.now(),
          title, author,
          dropboxUrl: normalizeDropboxUrl(url),
          position: 0, duration: 0,
          playbackRate: 1,
          createdAt: Date.now(),
          lastPlayedAt: Date.now()
        };
        await DB.save(newBook);
        modal.classList.add('hidden');
        document.getElementById('input-url').value = '';
        document.getElementById('input-title').value = '';
        document.getElementById('input-author').value = '';
        renderLibrary();
      };

      // Back to library
      document.getElementById('btn-back').onclick = () => {
        saveProgress();
        views.player.style.display = 'none';
        views.library.style.display = 'flex';
        renderLibrary();
      };

      // Player Controls
      btnPlayPause.onclick = togglePlay;
      
      document.getElementById('btn-skip-back').onclick = () => { audio.currentTime = Math.max(0, audio.currentTime - 15); };
      document.getElementById('btn-skip-fwd').onclick = () => { audio.currentTime = Math.min(audio.duration, audio.currentTime + 30); };
      
      speedBtn.onclick = () => {
        if (!currentBook) return;
        let idx = speeds.indexOf(currentBook.playbackRate);
        currentBook.playbackRate = speeds[(idx + 1) % speeds.length];
        audio.playbackRate = currentBook.playbackRate;
        speedBtn.innerText = currentBook.playbackRate + 'x';
        DB.save(currentBook);
      };

      seekBar.oninput = seekUpdate;

      // Audio Engine Events
      audio.addEventListener('timeupdate', () => {
        if (isNaN(audio.duration)) return;
        timeCurrent.innerText = formatTime(audio.currentTime);
        timeTotal.innerText = formatTime(audio.duration);
        seekBar.value = (audio.currentTime / audio.duration) * 100;
        saveProgress();
      });

      audio.addEventListener('play', () => {
        btnPlayPause.innerText = '⏸';
        clearTimeout(networkSeverTimer);
      });

      audio.addEventListener('pause', () => {
        btnPlayPause.innerText = '▶';
        saveProgress(); // Immediate save on pause
        
        // DATA EFFICIENCY REQUIREMENT: Stop downloading when paused
        // If paused for more than 10 seconds, fully kill the network connection to stop background buffering.
        clearTimeout(networkSeverTimer);
        networkSeverTimer = setTimeout(() => {
          if (audio.paused && currentBook) {
            console.log('Network severed to save data while paused.');
            audio.removeAttribute('src'); 
            audio.load();
          }
        }, 10000); 
      });

      // Handle app going to background (save immediately)
      document.addEventListener("visibilitychange", () => {
        if (document.hidden && currentBook) {
          saveProgress();
        }
      });
    }

    // Start App
    initApp();
  </script>
</body>
</html>
